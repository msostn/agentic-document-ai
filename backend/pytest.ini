[pytest]
# Phase 16: bare `pytest` from backend/ must collect the intended suite only.
# Without `testpaths`, pytest also collects the standalone phase regression
# scripts under scripts/ (they match test_*.py), which both runs the wrong
# suite and leaks request-scoped state into the unit tests.
testpaths = tests
markers =
    integration: requires a reachable backend API / live services (deselect with "-m \"not integration\"")
    regression: guards behavior established by an earlier phase (deselect with "-m \"not regression\"")
