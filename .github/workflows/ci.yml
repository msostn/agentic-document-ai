# Phase 17 — lightweight CI.
#
# Scope: deterministic checks only. CI deliberately does NOT fake the live
# evaluation or the database/Ollama regression drivers: a GitHub-hosted runner
# cannot supply Supabase PostgreSQL + Ollama, and pretending otherwise would be
# a fake gate. The live-service release gates (regression drivers, local E2E,
# golden evaluation, Docker verification) are documented in DEPLOYMENT.md and
# run on a machine with those services.
#
# Rules honoured here: every step fails the job on a non-zero exit code.
# There is no `continue-on-error`, no `|| true`, no retry loop.
#
# Local equivalent of this workflow:
#     python scripts/verify_release.py --offline

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (install, syntax, pytest, offline drivers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # `app.database` builds the engine at import time, so an importable
      # application needs a syntactically valid URL. Nothing in this job ever
      # opens a connection: the URL points at a closed local port.
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
      # Keep the offline run independent of a developer's local checkout.
      OLLAMA_BASE_URL: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install CPU torch (mirrors backend/Dockerfile)
        run: pip install --no-cache-dir "torch==2.14.0+cpu" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned runtime and development dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q app scripts

      - name: Import validation
        run: python -c "import app.main; import app.config; print('imports ok')"

      - name: Unit tests (integration tests need a live backend and are deselected)
        run: python -m pytest -m "not integration" --strict-markers

      - name: Offline regression drivers (chunking, deployment contract)
        run: |
          python scripts/test_chunker.py
          python scripts/test_phase13_deployment.py

  frontend:
    name: Frontend (install, lint, test, production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
