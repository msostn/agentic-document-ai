# Repository-root pytest configuration (Phase 17).
#
# The authoritative suite is backend/tests, configured by backend/pytest.ini,
# and the documented command is still `cd backend && python -m pytest`.
# Without this file, running plain `pytest` from the repository root finds no
# configuration and therefore also collects backend/scripts/test_*.py — those
# are driver scripts (their `record()` helper cannot fail), which both runs the
# wrong suite and leaks state into the unit tests (see ARCHITECTURE.md §16.3).
#
# `pythonpath = backend` makes `import app...` resolve the same way it does
# when pytest is started from backend/.
[pytest]
testpaths = backend/tests
pythonpath = backend
# Same registrations as backend/pytest.ini so --strict-markers behaves
# identically whichever directory pytest is started from.
markers =
    integration: requires a reachable backend API / live services (deselect with "-m \"not integration\"")
    regression: guards behavior established by an earlier phase (deselect with "-m \"not regression\"")
